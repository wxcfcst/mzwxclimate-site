<!DOCTYPE html>

<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nascer e Pôr do Sol
    </title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: transparent;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        #sun-home-container {

            opacity: 0;

            transition:
                opacity 0.5s ease;

        }


        #sun-home-container.sun-home-visible {

            opacity: 1;

        }


        .sun-home-panel {

            box-sizing: border-box;

            width: 100%;

            padding: 14px 18px;

            border-radius: 14px;

            background:
                rgba(0, 0, 0, 0.42);

            backdrop-filter:
                blur(4px);

            -webkit-backdrop-filter:
                blur(4px);

            color: white;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.20);

            animation:
                sunHomeBlink 3s ease-in-out infinite;

        }


        .sun-home-title {

            font-size: 1.05rem;

            font-weight: 700;

            margin-bottom: 3px;

        }


        .sun-home-date {

            font-size: 0.72rem;

            opacity: 0.75;

            margin-bottom: 12px;

        }


        .sun-home-times {

            display: flex;

            gap: 28px;

            align-items: center;

        }


        .sun-home-item {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .sun-home-icon {

            font-size: 1.45rem;

        }


        .sun-home-label {

            display: block;

            font-size: 0.68rem;

            opacity: 0.75;

        }


        .sun-home-item strong {

            display: block;

            font-size: 1.15rem;

        }


        @keyframes sunHomeBlink {

            0%,
            100% {

                opacity: 1;

            }

            50% {

                opacity: 0.72;

            }

        }


        @media (max-width: 600px) {

            .sun-home-times {

                gap: 18px;

            }

            .sun-home-item strong {

                font-size: 1rem;

            }

        }

    </style>

</head>


<body>

    <div id="sun-home-container"></div>


    <!--
        O astronomy.js contém calculateSunTimes().
    -->

    <script src="../assets/js/astronomy.js"></script>

    <script src="../assets/js/sun-home.js"></script>

</body>

</html>
