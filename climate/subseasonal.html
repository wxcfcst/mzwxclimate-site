<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MZ WX & Climate - Previsão Subsazonal</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/navigation.css">
</head>


<body>


<main>

    <!-- =========================================================
         TÍTULO DA PÁGINA
         ========================================================= -->

    <section class="hero">

        <div class="container">

            <div class="hero-content">

                <h2>Previsão Climática Subsazonal</h2>

                <p>
                    Previsões subsazonais de precipitação para Moçambique
                    baseadas em CCA e no modelo GEFSv12.
                </p>

            </div>

        </div>

    </section>


    <!-- =========================================================
         SELEÇÃO DOS PRODUTOS
         ========================================================= -->

    <section class="container">

        <h2 class="section-title">
            Produtos de Previsão
        </h2>


        <!-- Campo de seleção -->

        <div style="max-width:700px; margin:30px auto; text-align:center;">

            <label
                for="forecast-select"
                style="display:block; margin-bottom:10px; font-weight:600;"
            >
                Selecione o produto de previsão:
            </label>


            <select
                id="forecast-select"
                onchange="showForecast(this.value)"
                style="
                    width:100%;
                    padding:12px;
                    font-size:16px;
                    border-radius:6px;
                    border:1px solid #ccc;
                "
            >

                <!-- Nenhum produto selecionado inicialmente -->

                <option value="" selected>
                    -- Selecione um produto --
                </option>


                <!-- Produtos disponíveis -->

                <option value="week1">
                    🌧️ Previsão — Semana 1
                </option>


                <option value="week2">
                    🌧️ Previsão — Semana 2
                </option>


                <option value="exceedance">
                    📈 Probabilidade de Excedência
                </option>


                <option value="models_skill">
                    🌍 Destreza dos Modelos
                </option>

            </select>

        </div>


        <!-- =====================================================
             ÁREA ONDE O MAPA SERÁ MOSTRADO
             Inicialmente permanece escondida.
             ===================================================== -->

        <div
            id="forecast-container"
            style="
                display:none;
                text-align:center;
                margin-top:30px;
            "
        >

            <img
                id="forecast-image"
                src=""
                alt="Produto de previsão climática subsazonal"
                style="
                    max-width:100%;
                    height:auto;
                "
            >

        </div>


        <br><br>

    </section>


</main>


<!-- =============================================================
     JAVASCRIPT
     ============================================================= -->

<script>

function showForecast(product) {

    const image =
        document.getElementById("forecast-image");

    const container =
        document.getElementById("forecast-container");


    /*
     * Se o usuário voltar para
     * "-- Selecione um produto --",
     * remove a imagem e esconde o container.
     */

    if (product === "") {

        image.src = "";

        container.style.display = "none";

        return;
    }


    /*
     * Previsão — Semana 1
     */

    if (product === "week1") {

        image.src =
            "../assets/images/subseasonal/CCAvar[GEFSv12.PRCP][Week1][determinstic-probabilistic]-Forecast.png";

    }


    /*
     * Previsão — Semana 2
     */

    else if (product === "week2") {

        image.src =
            "../assets/images/subseasonal/CCAvar[GEFSv12.PRCP][Week2][determinstic-probabilistic]-Forecast.png";

    }


    /*
     * Probabilidade de Excedência
     */

    else if (product === "exceedance") {

        image.src =
            "../assets/images/subseasonal/CCA_flexForecast_probExceedence.png";

    }


    /*
     * Destreza dos Modelos
     */

    else if (product === "models_skill") {

        image.src =
            "../assets/images/subseasonal/CCA_models_skillMatrices.png";

    }


    /*
     * Depois que o produto foi selecionado,
     * mostra o container e, consequentemente,
     * a imagem escolhida.
     */

    container.style.display = "block";

}

</script>


<script src="../assets/js/navigation.js"></script>
</body>

</html>
