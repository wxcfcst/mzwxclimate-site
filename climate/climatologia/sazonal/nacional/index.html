<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Precipitação sazonal — Nacional | MZ WX &amp; Climate</title>
  <link rel="stylesheet" href="../../../../assets/css/style.css">
  <style>
    .climate-content { padding: 20px 0 32px; }
    .climate-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }
    .climate-card { background:#fff; padding:24px; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .climate-card h2,.climate-card h3 { color:#2d3748; margin-bottom:10px; }
    .climate-card p { color:#718096; margin-bottom:14px; }
    .climate-link { color:#667eea; font-weight:600; }
    .climate-map { background:#fff; max-width:860px; padding:14px; margin:18px auto; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .climate-map img {
      display: block;
      width: 100%;
      max-width: 840px;
      height: 460px;
      max-height: 65vh;
      object-fit: contain;
      margin: 0 auto;
    }
    .climate-map h2 { margin-bottom:12px; color:#2d3748; }
    .notice { padding:16px; background:#edf2f7; border-left:4px solid #667eea; border-radius:8px; }
    .breadcrumbs { margin:18px 0; color:#718096; }
    .breadcrumbs a { color:#667eea; }
  
    .map-selector {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      padding: 16px;
      background: #fff;
      border-radius: 12px;
    }
    .map-selector label {
      font-weight: 600;
      color: #2d3748;
    }
    .map-selector select {
      flex: 1;
      min-width: 200px;
      max-width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      background: #fff;
      color: #2d3748;
      font: inherit;
    }
      .page-header h1 {
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.05;
    }
    .page-header p {
      margin: 0 0 8px !important;
      padding: 0 !important;
      line-height: 1.1;
    }
  </style>
<link rel="stylesheet" href="../../../../assets/css/navigation.css">

<style id="padrao-climatologia-nacional">

/* Área principal */
.container.climate-content {
    width: 95%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 0 24px !important;
    box-sizing: border-box;
}

/* Cabeçalho */
.climate-content .page-header {
    margin: 0 0 4px !important;
    padding: 0 !important;
    min-height: 0 !important;
}

/* Título */
.climate-content .page-header h1 {
    font-size: 22px !important;
    font-weight: 600 !important;
    line-height: 1.1 !important;
    margin: 0 !important;
    padding: 0 !important;
}

/* Caixa do seletor */
.climate-content .map-selector {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;

    width: 600px !important;
    max-width: 100% !important;

    margin: 4px auto !important;
    padding: 8px 12px !important;

    background: #fff;
    border-radius: 12px;
    box-sizing: border-box !important;
}

/* Texto do seletor */
.climate-content .map-selector label {
    font-weight: 600;
    color: #2d3748;
}

/* Campo de seleção */
.climate-content .map-selector select {
    flex: 1;
    min-width: 0;
    max-width: 100%;

    padding: 10px 12px;
    border: 1px solid #cbd5e0;
    border-radius: 8px;

    background: #fff;
    color: #2d3748;
    font: inherit;
}

/* Caixa da figura */
.climate-content .climate-map {
    background: #fff;

    width: 600px !important;
    max-width: 100% !important;

    margin: 4px auto !important;
    padding: 0 !important;

    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);

    box-sizing: border-box !important;
}

/* Figura */
.climate-content .climate-map img {
    display: block !important;

    width: 100% !important;
    max-width: 600px !important;

    height: auto !important;
    max-height: 700px !important;

    object-fit: contain !important;
    margin: 0 auto !important;
}

/* Dispositivos móveis */
@media (max-width: 650px) {

    .climate-content .map-selector {
        width: 100% !important;
    }

    .climate-content .climate-map {
        width: 100% !important;
    }

    .climate-content .climate-map img {
        width: 100% !important;
        height: auto !important;
    }
}

</style>

</head>

<body>
<main class="container climate-content">
  <div class="page-header">
    <h1>Sazonal</h1>
    
  </div>

  <div class="map-selector">
    <label for="climate-product-select">Selecionar estação</label>
    <select id="climate-product-select">
      <option value="0">DJF — Dezembro–Fevereiro</option>
      <option value="1">MAM — Março–Maio</option>
      <option value="2">JJA — Junho–Agosto</option>
      <option value="3">SON — Setembro–Novembro</option>
    </select>
  </div>

  <section class="climate-map" aria-live="polite">
    
    <img
      id="climate-map-image"
      src="../../../../assets/images/climate/climatologia/sazonal/imerg_climatology_1999-2024_DJF.png"
      alt="Climatologia de precipitação — DJF, 1999–2024"
      loading="lazy">
  </section>
</main>

<script>
  const climateMaps = [{"label": "DJF — Dezembro–Fevereiro", "src": "../../../../assets/images/climate/climatologia/sazonal/imerg_climatology_1999-2024_DJF.png", "alt": "Climatologia de precipitação — DJF, 1999–2024"}, {"label": "MAM — Março–Maio", "src": "../../../../assets/images/climate/climatologia/sazonal/imerg_climatology_1999-2024_MAM.png", "alt": "Climatologia de precipitação — MAM, 1999–2024"}, {"label": "JJA — Junho–Agosto", "src": "../../../../assets/images/climate/climatologia/sazonal/imerg_climatology_1999-2024_JJA.png", "alt": "Climatologia de precipitação — JJA, 1999–2024"}, {"label": "SON — Setembro–Novembro", "src": "../../../../assets/images/climate/climatologia/sazonal/imerg_climatology_1999-2024_SON.png", "alt": "Climatologia de precipitação — SON, 1999–2024"}];
  const climateSelector =
    document.getElementById("climate-product-select");
  const climateImage =
    document.getElementById("climate-map-image");

  climateSelector.addEventListener("change", function () {
    const selectedMap = climateMaps[Number(this.value)];
    climateImage.src = selectedMap.src;
    climateImage.alt = selectedMap.alt;
  });
</script>
<script src="../../../../assets/js/navigation.js"></script>
</body>
</html>
