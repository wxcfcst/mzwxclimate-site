<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EUMETSAT | GOES16 | MSG | MTG - MZ WX & Climate</title>

<link rel="stylesheet" href="../assets/css/style.css">

<style>

/* ============================================================
   PÁGINA DE SATÉLITE
   ============================================================ */

.satellite-page {

    width: 100%;
    max-width: 1600px;

    margin: 0 auto;

    padding: 20px;

    box-sizing: border-box;

    font-family: Arial, Helvetica, sans-serif;

}


/* ============================================================
   TÍTULO PRINCIPAL
   ============================================================ */

.satellite-title {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    margin: 10px 0 30px 0;

}


/* ============================================================
   SUBTÍTULOS
   ============================================================ */

.satellite-subtitles {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 30px;

    margin-bottom: 10px;

}


.satellite-subtitle {

    font-size: 22px;

    font-weight: bold;

}


.satellite-subtitle.custom {

    text-align: left;

}


.satellite-subtitle.georing {

    text-align: right;

}


/* ============================================================
   DUAS CAIXAS
   ============================================================ */

.satellite-columns {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 30px;

    width: 100%;

}


/* ============================================================
   CAIXAS
   ============================================================ */

.satellite-box {

    border: 1px solid #cccccc;

    border-radius: 8px;

    background: #ffffff;

    padding: 20px;

    box-sizing: border-box;

    min-height: 500px;

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

}


/* ============================================================
   SELECTOR
   ============================================================ */

.satellite-selector {

    width: 100%;

    margin-bottom: 20px;

}


.satellite-selector label {

    display: block;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;

}


.satellite-selector select {

    width: 100%;

    padding: 10px;

    font-size: 16px;

    border: 1px solid #bbbbbb;

    border-radius: 5px;

    background: #ffffff;

}


/* ============================================================
   VISUALIZADOR
   ============================================================ */

#product-view {

    width: 100%;

    text-align: center;

}


.satellite-product {

    width: 100%;

}


.satellite-product-header {

    margin-bottom: 15px;

}


.satellite-product-header h2 {

    margin: 0;

    font-size: 20px;

}


.satellite-map {

    width: 100%;

    text-align: center;

}


.satellite-map img {

    display: block;

    width: 100%;

    height: auto;

    margin: 0 auto;

    border-radius: 5px;

}


/* ============================================================
   GEORING
   ============================================================ */

.georing-content {

    width: 100%;

    text-align: center;

}


.georing-selector {

    width: 100%;

    margin-bottom: 20px;

}


.georing-selector label {

    display: block;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;

}


.georing-selector select {

    width: 100%;

    padding: 10px;

    font-size: 16px;

    border: 1px solid #bbbbbb;

    border-radius: 5px;

    background: #ffffff;

}


#georing-view {

    width: 100%;

    min-height: 350px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.georing-placeholder {

    font-size: 17px;

    color: #666666;

    padding: 40px 20px;

}


/* ============================================================
   RESPONSIVIDADE
   ============================================================ */

@media (max-width: 900px) {

    .satellite-columns {

        grid-template-columns: 1fr;

    }


    .satellite-subtitles {

        grid-template-columns: 1fr;

        gap: 5px;

    }


    .satellite-subtitle.custom,
    .satellite-subtitle.georing {

        text-align: center;

    }

}


@media (max-width: 600px) {

    .satellite-page {

        padding: 10px;

    }


    .satellite-title {

        font-size: 24px;

    }


    .satellite-box {

        padding: 12px;

    }

}

</style>

</head>


<body>


<div class="satellite-page">


    <!-- ======================================================
         TÍTULO
         ====================================================== -->

    <div class="satellite-title">

        EUMETSAT | GOES16 | MSG | MTG

    </div>


    <!-- ======================================================
         SUBTÍTULOS
         ====================================================== -->

    <div class="satellite-subtitles">

        <div class="satellite-subtitle custom">

            Custom

        </div>


        <div class="satellite-subtitle georing">

            GeoRing

        </div>

    </div>


    <!-- ======================================================
         DUAS APRESENTAÇÕES
         ====================================================== -->

    <div class="satellite-columns">


        <!-- ==================================================
             CUSTOM
             ================================================== -->

        <div class="satellite-box">


            <div class="satellite-selector">



                <select id="product-select">

                    <option value="" selected disabled>

                        Escolha o produto

                    </option>

                </select>

            </div>


            <div id="product-view">

            </div>


        </div>


        <!-- ==================================================
             GEORING
             ================================================== -->

        <div class="satellite-box">


            <div class="georing-selector">



                <select id="georing-product">

                    <option value="" selected disabled>

                        Escolha o produto

                    </option>

                </select>

            </div>


            <div id="georing-view">

                <div class="georing-placeholder">

                    Produtos GeoRing

                </div>

            </div>


        </div>


    </div>


</div>


<!-- ==========================================================
     CUSTOM — IMAGENS MSG/SEVIRI
     ========================================================== -->

<script src="../assets/js/satellite.js?v=2"></script>


</body>

</html>
