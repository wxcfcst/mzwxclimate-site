<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MZ WX & Climate - METAR</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        .metar-home {

            position: relative;

            width: 100%;
            height: 500px;

            min-height: 300px;

            background-image:
                url("../assets/images/home/thunderstorm.gif");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;
        }


        /* =====================================================
           METAR
           ===================================================== */

        #metar-home-container {

            position: absolute;

            top: 25px;
            left: 25px;

            width: 360px;

            z-index: 10;
        }


        .metar-home-card {

            width: 100%;

            padding: 18px 20px;

            background:
                rgba(0, 0, 0, 0.52);

            border-radius: 14px;

            color: white;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.35);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            animation:
                metarHomeFade 0.6s ease;
        }


        .metar-home-title {

            font-size: 1.2rem;

            font-weight: 700;

            margin-bottom: 4px;
        }


        .metar-home-temp {

            font-size: 2.3rem;

            font-weight: 700;

            margin-bottom: 10px;
        }


        .metar-home-details {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }


        .metar-home-details span {

            display: block;

            font-size: 0.72rem;

            opacity: 0.75;

            margin-bottom: 2px;
        }


        .metar-home-details strong {

            display: block;

            font-size: 0.95rem;
        }


        .metar-home-time {

            margin-top: 12px;

            padding-top: 8px;

            border-top:
                1px solid
                rgba(255,255,255,0.20);

            font-size: 0.7rem;

            opacity: 0.75;
        }


        /* =====================================================
           ANIMAÇÃO
           ===================================================== */

        @keyframes metarHomeFade {

            from {

                opacity: 0;

                transform:
                    translateY(8px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            #metar-home-container {

                top: 15px;

                left: 15px;

                width:
                    calc(100% - 30px);

                max-width: 340px;
            }

        }

    </style>

</head>


<body>

    <div class="metar-home">

        <div id="metar-home-container"></div>

    </div>


    <script
        src="../assets/js/metar-home.js">
    </script>

</body>

</html>
