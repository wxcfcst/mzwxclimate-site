<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaicos de análise sinótica | MZ WX & Climate</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#1b2b3e;background:#f3f6fa}
body{max-width:1450px;margin:0 auto;padding:1.2rem}
a{color:#145d9d}h1{margin-bottom:.25rem}.note{color:#43566d}
.controls{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin:1.2rem 0}
select{font:inherit;padding:.5rem;max-width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
figure{background:white;margin:0;border:1px solid #d8e2ec;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px #0001}
figure img{width:100%;height:auto;display:block;cursor:zoom-in}figcaption{padding:.75rem;font-weight:600}
small{display:block;font-weight:400;color:#486075;margin-top:.3rem}
#status{margin:.75rem 0}dialog{width:min(96vw,1500px);max-height:95vh;border:0;border-radius:8px;padding:1rem}
dialog img{max-width:100%;max-height:82vh;display:block;margin:auto}.close{float:right;padding:.35rem .75rem}
/* NWP_MOSAICS_BRAND_V2 */
figure .mosaic-brand{display:block;text-align:right;padding:.1rem .75rem .75rem;font-size:.78rem;font-weight:700;color:#145d9d;text-decoration:none;}
figure .mosaic-brand:hover{text-decoration:underline}
@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<p><a href="index.html">← Cartas NWP individuais</a></p>
<h1>🌍 Mosaicos de análise sinótica</h1>
<p class="note">Mosaicos meteorológicos com quatro imagens de modelos numéricos ou de satélite, organizadas para facilitar a análise sinóptica. Clique numa imagem para ampliá-la.</p>
<div class="controls"><label for="choice">Mosaico:</label><!-- NWP_MOSAIC_SELECT_PLACEHOLDER_V1 -->
<select id="choice" required>
  <option value="" selected disabled>Selecione o mosaico</option>
</select><span id="valid"></span></div>
<p id="status" role="status">Carregando produtos...</p>
<main id="grid" class="grid"></main>
<dialog id="zoom"><button class="close" id="close" type="button">Fechar ×</button><div id="zoomtitle"></div><img id="zoomimg" alt="Carta ampliada"></dialog>
<script>
'use strict';
const siteRoot = '../'; // /nwp/mosaics.html -> raiz do site
const choice=document.querySelector('#choice'), grid=document.querySelector('#grid');
const status=document.querySelector('#status'), valid=document.querySelector('#valid');
const dlg=document.querySelector('#zoom');
let items=[];
function formatUTC(value){
 const dt = new Date(value.endsWith('Z') ? value : value + 'Z');
 if (Number.isNaN(dt.getTime())) return value;
 return new Intl.DateTimeFormat('pt-BR', {
   day:'2-digit',month:'2-digit',year:'numeric',
   hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'UTC'
 }).format(dt).replace(',', ' às ') + ' UTC';
}
function render(){
 const item=items.find(x=>x.id===choice.value);grid.replaceChildren();
 if(!item){status.textContent=items.length ? 'Selecione um mosaico para visualizar as cartas.' : 'Nenhum mosaico completo disponível.';valid.textContent='';return;}
 status.textContent='';valid.textContent='Horário indicado nos produtos: '+formatUTC(item.datetime);
 for(const p of item.panels){
   const fig=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption'),sm=document.createElement('small');
   img.src=siteRoot+p.path;img.alt=p.name+' — '+p.model;img.loading='lazy';
   img.addEventListener('click',()=>{document.querySelector('#zoomimg').src=img.src;document.querySelector('#zoomtitle').textContent=p.name+' — '+p.model;dlg.showModal();});
   cap.textContent=p.name;sm.textContent=p.model+' · '+formatUTC(p.datetime);cap.append(sm);const brand=document.createElement('a');brand.className='mosaic-brand';brand.href='https://sites.google.com/view/mzwxclimate';brand.textContent='MZ WX & Climate';brand.target='_blank';brand.rel='noopener noreferrer';fig.append(img,cap,brand);grid.append(fig);
 }
}
choice.addEventListener('change',render);
document.querySelector('#close').addEventListener('click',()=>dlg.close());
fetch(siteRoot+'assets/data/nwp/mosaics.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{
 items=data.mosaics||[];
 for(const x of items){let option=document.createElement('option');option.value=x.id;option.textContent=x.title;choice.append(option);}
 render();
}).catch(err=>{status.textContent='Não foi possível carregar mosaics.json: '+err.message;});
</script>
<!-- NWP_MOSAICS_BRAND_V2 -->
</body>
</html>
