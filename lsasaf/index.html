

<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produtos LSASAF - MZ WX & Climate</title>

<style>

body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    background: #f0f4f8;
    color: #1a202c;
}


/* ============================================================
   CONTAINER PRINCIPAL
   ============================================================ */

.lsasaf-container {

    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    padding: 30px 20px 50px;

    box-sizing: border-box;
}


/* ============================================================
   CABEÇALHO
   ============================================================ */

.lsasaf-header {

    text-align: center;

    margin-bottom: 30px;
}


.lsasaf-header h1 {

    margin: 0 0 10px;

    color: #2d3748;

    font-size: 2.2rem;

    font-weight: 700;
}


.lsasaf-header p {

    margin: 0 auto;

    max-width: 750px;

    color: #718096;

    font-size: 1rem;

    line-height: 1.6;
}


/* ============================================================
   SELETOR
   ============================================================ */

.selector {

    text-align: center;

    margin: 25px auto 30px;
}


.selector label {

    display: block;

    margin-bottom: 8px;

    color: #2d3748;

    font-weight: 600;

    font-size: 1rem;
}


select {

    width: 100%;

    max-width: 500px;

    padding: 12px 15px;

    font-size: 16px;

    border: 1px solid #cbd5e0;

    border-radius: 8px;

    background: white;

    color: #2d3748;

    cursor: pointer;

    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}


select:focus {

    outline: none;

    border-color: #667eea;

    box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
}


/* ============================================================
   ÁREA DO PRODUTO
   ============================================================ */

#product-view {

    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow: 0 2px 12px rgba(0,0,0,0.06);

    max-width: 1100px;

    margin: 0 auto;
}


.product-title {

    text-align: center;

    color: #2d3748;

    margin: 0 0 10px;

    font-size: 1.6rem;
}


.product-description {

    text-align: center;

    color: #718096;

    max-width: 800px;

    margin: 0 auto 20px;

    line-height: 1.6;
}


.product-datetime {

    text-align: center;

    margin-bottom: 20px;

    font-size: 0.9rem;

    color: #4a5568;

    background: #f7fafc;

    padding: 8px 12px;

    border-radius: 8px;

    display: block;
}


/* ============================================================
   IMAGEM PRINCIPAL
   ============================================================ */

.map-container {

    width: 100%;

    text-align: center;

    margin: 20px 0;
}


.map-image {

    display: block;

    width: 100%;

    max-width: 1000px;

    height: auto;

    margin: 0 auto;

    border-radius: 10px;

    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}


/* ============================================================
   HISTÓRICO
   ============================================================ */

.history-title {

    text-align: center;

    margin: 35px 0 20px;

    color: #2d3748;

    font-size: 1.3rem;
}


.gallery {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;

    align-items: start;
}


.gallery-item {

    display: block;

    background: #f7fafc;

    padding: 8px;

    border-radius: 10px;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.gallery-item:hover {

    transform: translateY(-3px);

    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}


.gallery img {

    display: block;

    width: 100%;

    height: auto;

    border-radius: 7px;
}


/* ============================================================
   MENSAGENS
   ============================================================ */

.message {

    text-align: center;

    padding: 40px 20px;

    color: #718096;

    font-size: 1rem;
}


.error-message {

    color: #c53030;

    background: #fff5f5;

    border-radius: 10px;

    padding: 20px;

    text-align: center;
}


/* ============================================================
   FONTE
   ============================================================ */

.source {

    text-align: center;

    margin-top: 30px;

    color: #718096;

    font-size: 0.85rem;

}


.source strong {

    color: #4a5568;
}


/* ============================================================
   RESPONSIVIDADE
   ============================================================ */

@media (max-width: 768px) {

    .lsasaf-container {

        padding: 20px 12px 40px;
    }


    .lsasaf-header h1 {

        font-size: 1.8rem;
    }


    #product-view {

        padding: 15px;

        border-radius: 12px;
    }


    .product-title {

        font-size: 1.3rem;
    }


    .gallery {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }

}


@media (max-width: 480px) {

    .lsasaf-header h1 {

        font-size: 1.5rem;
    }


    .lsasaf-header p {

        font-size: 0.9rem;
    }


    .gallery {

        grid-template-columns: 1fr;
    }

}


</style>

</head>


<body>


<div class="lsasaf-container">


    <!-- ======================================================
         CABEÇALHO
         ====================================================== -->

    <header class="lsasaf-header">

        <h1>
            Produtos EUMETSAT / LSA SAF
        </h1>

        <p>
            Produtos de satélite do
            <strong>Land Surface Analysis Satellite Applications Facility
            (LSA SAF)</strong>,
            disponibilizados pela EUMETSAT.
        </p>

    </header>


    <!-- ======================================================
         SELETOR
         ====================================================== -->

    <div class="selector">

        <label for="product-select">
            Seleccione o produto:
        </label>

        <select id="product-select">

            <option value="">
                Escolha o Produto
            </option>

        </select>

    </div>


    <!-- ======================================================
         VISUALIZAÇÃO
         ====================================================== -->

    <div id="product-view">

        <div class="message">

            Seleccione um produto LSASAF para visualizar.

        </div>

    </div>


    <!-- ======================================================
         FONTE
         ====================================================== -->

    <div class="source">

        Fonte:
        <strong>EUMETSAT / LSA SAF</strong>

    </div>


</div>


<script src="../assets/js/lsasaf.js"></script>


</body>

</html>
